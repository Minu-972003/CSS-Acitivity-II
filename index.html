<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>CSS Box Model</title>

    <style>

        /* BOX 1 */
        .box1 {
            width: 200px;
            height: 200px;

            background-color: cadetblue;

            padding: 20px;

            border: 10px solid black;

            margin: 0;
        }


        /* Remove paragraph margins */
        p {
            margin: 0;
        }


        /* BOX 2 */
        .box2 {
            width: 200px;
            height: 200px;

            background-color: gold;

            border-top: 20px solid black;
            border-bottom: 20px solid black;
            border-left: 10px solid black;
            border-right: 10px solid black;

            /* Move box 2 to the right */
            margin-left: 260px;

            /* Touch box 1 */
            margin-top: 0;
        }


        /* BOX 3 */
        .box3 {
            width: 200px;
            height: 200px;

            background-color: indianred;

            border: 10px solid black;

            /* Move box 3 to the left */
            margin-left: 40px;

            /* Touch box 2 */
            margin-top: 0;
        }

    </style>

</head>


<body>

    <!-- FIRST BOX -->

    <div class="box1">

        <p>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit.
            Aliquam at sapien porttitor urna elementum lacinia.
            In id magna pulvinar, ultricies lorem id, vehicula elit.
            Aliquam eu luctus nisl, vitae pellentesque magna.
            Phasellus dolor metus, laoreet ac convallis sit amet,
            efficitur sed dolor.
        </p>

    </div>


    <!-- SECOND BOX -->

    <div class="box2">

    </div>


    <!-- THIRD BOX -->

    <div class="box3">

    </div>


</body>

</html>
